name = "PFUL"
defaultTargets = ["PFUL", "Legacy", "MathlibPR"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.34.1"

# Main result: complex / star-field Gram cancellation, M Mᴴ = 1 (uses Mathlib).
[[lean_lib]]
name = "PFUL"
roots = ["PFUL.UnitaryLift", "PFUL.Column", "PFUL.Countable", "PFUL.Rows", "PFUL.Assemble", "PFUL.Validity", "PFUL.Isometry", "PFUL.Channels", "PFUL.Choi", "PFUL.ChoiAnc", "PFUL.ChoiThm", "PFUL.Bookkeeping", "PFUL.TraceClass", "PFUL.TraceValidity", "PFUL.BornPairing", "PFUL.Polar", "PFUL.KrausL2", "PFUL.Schmidt", "PFUL.ChoiL2", "PFUL.ChoiConverse", "PFUL.CPTP", "PFUL.SchmidtTraceNorm", "PFUL.TraceNormDense", "PFUL.KrausNormal", "PFUL.CommutingBlend", "PFUL.CounterexampleData", "PFUL.Counterexample"]

# Earlier Mathlib-free files (combinatorial lemma, finite checks).
[[lean_lib]]
name = "Legacy"
roots = ["Lift", "Full", "Gaps", "Cancel", "GramGeneral", "ComplexGram", "StinespringBoundary"]

# Standalone Mathlib-style file (no project dependencies), candidate Mathlib PR.
[[lean_lib]]
name = "MathlibPR"
roots = ["MathlibPR.PolarDecomposition"]
